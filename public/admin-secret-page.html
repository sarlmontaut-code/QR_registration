<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestion Clients</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --danger-color: #ef4444;
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border-color: #475569;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Gestion des Clients</h1>
            <a href="/export-valeurs-clients-75/download" class="btn btn-primary" id="downloadBtn">Télécharger Excel</a>
        </div>

        <table id="clientsTable">
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th>Téléphone</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="clientsList">
                <!-- Les clients seront chargés ici -->
            </tbody>
        </table>
    </div>

    <script>
        const clientsList = document.getElementById('clientsList');
        const secretPath = '/export-valeurs-clients-75';

        async function loadClients() {
            try {
                const response = await fetch('/api/clients');
                const clients = await response.json();

                if (clients.length === 0) {
                    clientsList.innerHTML = '<tr><td colspan="5" class="empty-state">Aucun client enregistré pour le moment.</td></tr>';
                    return;
                }

                clientsList.innerHTML = clients.map(client => `
                    <tr>
                        <td>${client.lastName}</td>
                        <td>${client.firstName}</td>
                        <td>${client.phone || '-'}</td>
                        <td>${new Date(client.registrationDate).toLocaleDateString('fr-FR')}</td>
                        <td>
                            <button class="btn btn-danger" onclick="deleteClient('${client._id}')">Supprimer</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Erreur chargement clients:', err);
            }
        }

        async function deleteClient(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce client ?')) return;

            try {
                const response = await fetch(`/api/clients/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadClients();
                } else {
                    alert('Erreur lors de la suppression');
                }
            } catch (err) {
                alert('Erreur réseau');
            }
        }

        loadClients();
    </script>
</body>

</html>
