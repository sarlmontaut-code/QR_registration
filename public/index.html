<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enregistrement Client - Cordeur Express</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border-color: #475569;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--surface-color);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), #7c3aed);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            filter: brightness(1.1);
        }

        .success-msg {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .success-msg div {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .success-msg h2 {
            color: var(--success-color);
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="card" id="formCard">
        <div class="header">
            <h1>CARREFOUR SALIES DU SALAT</h1>
            <p>Veuillez remplir vos informations pour votre fiche client.</p>
        </div>
        <form id="registrationForm">
            <div class="form-group">
                <label>Nom</label>
                <input type="text" id="lastName" name="lastName" required placeholder="Ex: Dupont">
            </div>
            <div class="form-group">
                <label>Prénom</label>
                <input type="text" id="firstName" name="firstName" required placeholder="Ex: Jean">
            </div>
            <div class="form-group">
                <label>Âge</label>
                <input type="number" id="age" name="age" required placeholder="Ex: 35">
            </div>
            <div class="form-group">
                <label>Numéro de Téléphone</label>
                <input type="tel" id="phone" name="phone" required placeholder="Ex: 06 12 34 56 78">
            </div>
            <button type="submit">Valider</button>
        </form>
    </div>

    <div class="card success-msg" id="successCard">
        <div>✅</div>
        <h2>Merci !</h2>
        <p>Vos informations ont été enregistrées avec succès.</p>
    </div>


    <script>
        const form = document.getElementById('registrationForm');
        const formCard = document.getElementById('formCard');
        const successCard = document.getElementById('successCard');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    formCard.style.display = 'none';
                    successCard.style.display = 'block';
                } else {
                    alert("Erreur lors de l'enregistrement. Veuillez réessayer.");
                }
            } catch (err) {
                alert("Une erreur est survenue.");
            }
        };
    </script>
</body>

</html>
